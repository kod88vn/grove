name: Deploy grove

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: grove

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for turbo diff detection

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      # Detect which packages changed since the last commit on this branch
      - name: Detect changed packages
        id: changed
        shell: sh
        run: |
          # For pushes to master, compare against the previous commit on the branch
          BASE=$(git rev-parse HEAD~1)
          HEAD=$(git rev-parse HEAD)

          # Get list of changed package directories
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -E '^apps/' \
            | cut -d/ -f1-2 \
            | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "No app packages changed, running all tests."
            FILTER="..."
          else
            # Build turbo filter from changed packages (use npm package names)
            FILTER=""
            for pkg in $CHANGED; do
              APP=$(basename "$pkg")
              case "$APP" in
                games) FILTER="$FILTER --filter=@grove/games" ;;
                gateway) FILTER="$FILTER --filter=@grove/gateway" ;;
                grove) FILTER="$FILTER --filter=@grove/grove" ;;
                homeworks) FILTER="$FILTER --filter=@grove/homeworks" ;;
                nora) FILTER="$FILTER --filter=nora" ;;
                orchestrator) FILTER="$FILTER --filter=@grove/orchestrator" ;;
                reminders) FILTER="$FILTER --filter=@grove/reminders" ;;
                shopping-list) FILTER="$FILTER --filter=@grove/shopping-list" ;;
              esac
            done
          fi

          # Default to all packages if nothing changed and no filter set
          FILTER="${FILTER:-...}"

          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
          echo "TURBO_FILTER=$FILTER" >> "$GITHUB_ENV"

      - name: Test affected packages
        run: yarn turbo test $TURBO_FILTER

      - name: Build affected packages
        run: yarn turbo build $TURBO_FILTER

      - name: Build and tag Docker image
        shell: powershell
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Write-Host "Building image grove:$sha"
          docker build `
            --build-arg COMMIT_HASH=$sha `
            -t grove:$sha `
            -t grove:latest `
            .
          echo "IMAGE_TAG=$sha" >> $env:GITHUB_ENV

      - name: Swap container
        shell: powershell
        run: |
          $tag = $env:IMAGE_TAG

          # Ensure persistent data volume exists for SQLite chat history
          docker volume create nora-data | Out-Null

          $running = docker ps -q --filter "name=grove-live"
          if ($running) {
            Write-Host "Stopping old container grove-live"
            docker stop grove-live | Out-Null
            docker rm grove-live | Out-Null
          }

          Write-Host "Starting grove:$tag"
          docker run -d `
            --name grove-live `
            --restart always `
            -p 80:80 `
            -e NORA_DB_PATH=/data/nora.db `
            -v nora-data:/data `
            grove:$tag

      - name: Verify Nora is reachable
        shell: powershell
        run: |
          $healthy = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1/" -UseBasicParsing -TimeoutSec 10
              if ($resp.StatusCode -ge 200 -and $resp.StatusCode -lt 500) { $healthy = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }

          if (-not $healthy) {
            docker logs grove-live --tail 100
            throw "Nora did not become healthy after deploy"
          }

          Write-Host "Nora health check OK"

      - name: Prune old images
        shell: powershell
        run: docker image prune -f
