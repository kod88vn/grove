# Deploy Grove on every green master push / merged PR.
#
# Hosting lives on the "grove" machine (a Mac). Public repo + free plan means
# GitHub Actions cannot use self-hosted runners, so CI never builds on the host:
#
#   1. `test` runs the real validation on GitHub-hosted runners (free minutes).
#   2. `deploy` notifies the host daemon running on the grove machine. The daemon
#      (ops/deploy/host-daemon.mjs) checks out the exact commit, builds the Docker
#      image, swaps the live container, runs health checks, and reports back to
#      GitHub as a commit status. It also polls GitHub on its own, so a missed
#      webhook still gets deployed.
#
# Required repository settings (one-time, see ops/deploy/README.md):
#   - Secret:  GROVE_DEPLOY_TOKEN  — shared secret for the daemon webhook
#   - Variable: GROVE_DEPLOY_URL   — public URL of the daemon (Tailscale Funnel)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [closed]
  pull_request_target:
    branches: [master]
    types: [closed]
  workflow_dispatch: {}

jobs:
  test:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed for turbo --filter=[HEAD^1]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Detect changed packages
        id: changed
        run: |
          # For push events, compare against the previous commit
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_REF="${{ github.event.before }}"
            if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
              echo "First push, running all tests."
              echo "filter=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          fi

          # Get changed package directories
          CHANGED_DIRS=$(git diff --name-only "$BASE_REF" HEAD \
            | grep '^apps/[^/]' \
            | cut -d'/' -f1-2 \
            | sort -u)

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No app packages changed, running all tests."
            echo "filter=" >> "$GITHUB_OUTPUT"
          else
            FILTER=""
            for dir in $CHANGED_DIRS; do
              app=$(basename "$dir")
              case "$app" in
                games)        FILTER="$FILTER --filter=@grove/games" ;;
                gateway)      FILTER="$FILTER --filter=@grove/gateway" ;;
                grove)        FILTER="$FILTER --filter=@grove/grove" ;;
                homeworks)    FILTER="$FILTER --filter=@grove/homeworks" ;;
                nora)         FILTER="$FILTER --filter=nora" ;;
                orchestrator) FILTER="$FILTER --filter=@grove/orchestrator" ;;
                reminders)    FILTER="$FILTER --filter=@grove/reminders" ;;
                shopping-list) FILTER="$FILTER --filter=@grove/shopping-list" ;;
              esac
            done
            echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
            echo "Changed packages: $CHANGED_DIRS"
          fi

      - name: Test CI scripts
        run: node --test '.github/scripts/*.test.mjs'

      - name: Test affected packages
        run: yarn turbo test ${{ steps.changed.outputs.filter }}

  deploy:
    needs: test
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify grove host daemon
        env:
          GROVE_DEPLOY_URL: ${{ vars.GROVE_DEPLOY_URL }}
          GROVE_DEPLOY_TOKEN: ${{ secrets.GROVE_DEPLOY_TOKEN }}
        run: |
          if [ -z "${GROVE_DEPLOY_URL:-}" ] || [ -z "${GROVE_DEPLOY_TOKEN:-}" ]; then
            echo "GROVE_DEPLOY_URL / GROVE_DEPLOY_TOKEN not configured — skipping deploy notification."
            echo "Set them in repo Settings (see ops/deploy/README.md). The host daemon's"
            echo "polling fallback will still pick this commit up."
            exit 0
          fi
          SHA="${{ github.event.pull_request.merge_commit_sha || github.sha }}"
          if [ -z "$SHA" ]; then
            echo "No deploy SHA — skipping."
            exit 0
          fi
          echo "Requesting deploy of ${SHA:0:7} at $GROVE_DEPLOY_URL"
          CODE=$(curl -sS -o /tmp/grove-deploy-response.json -w '%{http_code}' \
            -X POST "$GROVE_DEPLOY_URL/deploy/$GROVE_DEPLOY_TOKEN" \
            -H 'content-type: application/json' \
            -d "{\"sha\":\"$SHA\"}" \
            --max-time 30) || CODE=000
          cat /tmp/grove-deploy-response.json 2>/dev/null || true
          echo
          if [ "$CODE" != "202" ] && [ "$CODE" != "200" ]; then
            echo "Deploy host unreachable (HTTP $CODE). The host daemon polls GitHub every"
            echo "${POLL_INTERVAL:-60}s, so this commit will still be deployed once the"
            echo "daemon is reachable."
            exit 1
          fi
          echo "Deploy request accepted — the grove host is deploying ${SHA:0:7}."
