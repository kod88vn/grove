name: Deploy grove

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: grove

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed for turbo --filter=[HEAD^1]

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Test affected packages
        run: yarn turbo test --filter=...[HEAD^1]

      - name: Build affected packages
        run: yarn turbo build --filter=...[HEAD^1]


      - name: Kill any running Watt (Task Scheduler)
        shell: powershell
        run: |
          Get-Process -Name "node" -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*watt*" } | ForEach-Object { $_.Kill() }
          Write-Host "Killed any running Watt processes (if present)"

      - name: Write commit hash to .env.local
        shell: bash
        run: |
          node ./apps/nora/scripts/write-commit-hash.cjs

      - name: Build Nora for runtime
        run: yarn workspace nora build

      - name: Restart Watt
        shell: powershell
        run: |
          npx wattpm@3.52.4 stop watt.json 2>$null
          $wattRoot = (Resolve-Path ".").Path
          Start-Process -FilePath "cmd.exe" `
            -ArgumentList "/c npx wattpm@3.52.4 start watt.json > watt.log 2>&1" `
            -WorkingDirectory $wattRoot `
            -WindowStyle Hidden
          Write-Host "Watt started in background"
          Start-Sleep -Seconds 10
          exit 0


      - name: Verify Nora is reachable locally
        shell: powershell
        run: |
          try {
            $resp = Invoke-WebRequest -Uri "http://127.0.0.1/" -UseBasicParsing -TimeoutSec 20
            if ($resp.StatusCode -lt 200 -or $resp.StatusCode -ge 500) {
              throw "Unexpected status code: $($resp.StatusCode)"
            }
            Write-Host "Nora health check OK: HTTP $($resp.StatusCode)"
          } catch {
            Get-Content watt.log -Tail 100
            throw
          }
