name: Deploy grove

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: grove

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed for turbo --filter=[HEAD^1]

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: yarn workspace nora rebuild better-sqlite3

      - name: Test affected packages
        run: yarn turbo test --filter=...[HEAD^1]

      - name: Build affected packages
        run: yarn turbo build --filter=...[HEAD^1]

      - name: Build and tag Docker image
        shell: powershell
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Write-Host "Building image grove:$sha"
          docker build `
            --build-arg COMMIT_HASH=$sha `
            -t grove:$sha `
            -t grove:latest `
            .
          echo "IMAGE_TAG=$sha" >> $env:GITHUB_ENV

      - name: Swap container
        shell: powershell
        run: |
          $tag = $env:IMAGE_TAG

          $running = docker ps -q --filter "name=grove-live"
          if ($running) {
            Write-Host "Stopping old container grove-live"
            docker stop grove-live | Out-Null
            docker rm grove-live | Out-Null
          }

          Write-Host "Starting grove:$tag"
          docker run -d `
            --name grove-live `
            --restart always `
            -p 80:80 `
            grove:$tag

      - name: Verify Nora is reachable
        shell: powershell
        run: |
          $healthy = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1/" -UseBasicParsing -TimeoutSec 10
              if ($resp.StatusCode -ge 200 -and $resp.StatusCode -lt 500) { $healthy = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }

          if (-not $healthy) {
            docker logs grove-live --tail 100
            throw "Nora did not become healthy after deploy"
          }

          Write-Host "Nora health check OK"

      - name: Prune old images
        shell: powershell
        run: docker image prune -f
