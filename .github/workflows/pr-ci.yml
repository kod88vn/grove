name: PR CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  # Re-run the merge gate as soon as a reviewer (typically the coding agent, free)
  # submits a review, so an approval can merge without waiting for a new push.
  pull_request_review:
    branches: [master]
    types: [submitted]

concurrency:
  # Event in the group: a review event must not cancel the PR's test run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Test + build only on PR open/sync (not re-run for every review event).
  pr-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Detect changed packages
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Get changed package directories
          CHANGED_DIRS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep '^apps/[^/]' \
            | cut -d'/' -f1-2 \
            | sort -u)

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No app packages changed explicitly, running all tests."
            FILTER=""
          else
            FILTER=""
            for dir in $CHANGED_DIRS; do
              app=$(basename "$dir")
              case "$app" in
                games)        FILTER="$FILTER --filter=@grove/games" ;;
                gateway)      FILTER="$FILTER --filter=@grove/gateway" ;;
                grove)        FILTER="$FILTER --filter=@grove/grove" ;;
                homeworks)    FILTER="$FILTER --filter=@grove/homeworks" ;;
                nora)         FILTER="$FILTER --filter=nora" ;;
                orchestrator) FILTER="$FILTER --filter=@grove/orchestrator" ;;
                reminders)    FILTER="$FILTER --filter=@grove/reminders" ;;
                shopping-list) FILTER="$FILTER --filter=@grove/shopping-list" ;;
              esac
            done
          fi

          # When FILTER is empty, turbo runs the task across all workspace packages

          if echo "$CHANGED_DIRS" | grep -q '^apps/homeworks$'; then
            echo "homeworks=true" >> "$GITHUB_OUTPUT"
          else
            echo "homeworks=false" >> "$GITHUB_OUTPUT"
          fi
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
          echo "Changed packages: $CHANGED_DIRS or all ($FILTER)"

      - name: Test CI scripts
        run: node --test '.github/scripts/*.test.mjs'

      - name: Test affected packages
        run: yarn turbo test ${{ steps.changed.outputs.filter }}

      - name: Install Chromium for Homeworks browser tests
        if: steps.changed.outputs.homeworks == 'true'
        run: npx playwright install --with-deps chromium

      - name: Test Homeworks in Chromium
        if: steps.changed.outputs.homeworks == 'true'
        timeout-minutes: 10
        run: yarn workspace @grove/homeworks test:browser

      - name: Build affected packages
        run: yarn turbo build ${{ steps.changed.outputs.filter }}

      - name: Check Nora architecture
        run: yarn turbo arch --filter=nora

  # The code review itself is performed by the coding agent, free (see AGENTS.md,
  # "Code Review (Agent-Performed)"). There is deliberately NO paid review API here.
  # This job only observes the agent's result: it waits for an approval from a
  # trusted (human) reviewer on the PR's head commit so pr-auto-merge can proceed.
  review-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.status.outputs.verdict }}
    steps:
      - name: Wait for agent review approval
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export REPO PR_NUMBER HEAD_SHA
          # Trusted = a real human account (bots and GitHub's own AI review
          # accounts are excluded). The agent posts its review as its working
          # account; on its OWN pull request GitHub forbids approval, so it
          # posts the same review as a comment starting with the
          # "## AI Code Review" marker. Both forms count, on the head SHA only.
          for i in $(seq 1 39); do
            N=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --paginate --jq \
              '[.[] | select(.commit_id == env.HEAD_SHA) | select((.user.login | ascii_downcase | endswith("[bot]")) | not) | select(.user.login != "Copilot") | select(.state == "APPROVED" or (.state == "COMMENTED" and ((.body // "") | startswith("## AI Code Review"))))] | length' 2>/dev/null || echo 0)
            if [ "${N:-0}" -gt 0 ]; then
              echo "verdict=APPROVE" >> "$GITHUB_OUTPUT"
              echo "Review found on head ${HEAD_SHA:0:7} (trusted approval or agent review)."
              exit 0
            fi
            sleep 15
          done
          echo "verdict=REQUEST_CHANGES" >> "$GITHUB_OUTPUT"
          echo "No review on head ${HEAD_SHA:0:7} yet — the coding agent must review (see AGENTS.md) and post its verdict. Not merging."

  # Must wait for BOTH pr-ci (build) and review-status (agent review) to be settled.
  # The gate script comes from master (base checkout): a PR cannot change its own gate.
  pr-auto-merge:
    needs: [pr-ci, review-status]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      always() &&
      needs.review-status.result == 'success' &&
      needs.review-status.outputs.verdict == 'APPROVE' &&
      (needs.pr-ci.result == 'success' || needs.pr-ci.result == 'skipped') &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge') &&
      github.event.pull_request.author_association == 'OWNER'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # Check out the BASE commit, not the PR: this job holds a write token, so the gate
      # script must come from master, where the PR cannot change it. The job no longer
      # checks out any code from the PR.
      - name: Checkout base (trusted gate script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The verdict output above is not enough: re-read the PR's real state (approvals,
      # threads, CI runs for the head commit, review runs). Any open thread, change
      # request, or non-green test run blocks the merge.
      - name: Merge gate (trusted approval, no open threads, tests green)
        run: node .github/scripts/merge-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

      # No --auto: without branch protection it merges immediately anyway, and the gate
      # above has already decided.
      - name: Merge PR (squash)
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --match-head-commit ${{ github.event.pull_request.head.sha }} \
            --subject "Squash merge" \
            --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
