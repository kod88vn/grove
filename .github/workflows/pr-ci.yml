name: PR CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  pr-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Detect changed packages
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Get changed package directories
          CHANGED_DIRS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep '^apps/[^/]' \
            | cut -d'/' -f1-2 \
            | sort -u)

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No app packages changed explicitly, running all tests."
            FILTER=""
          else
            FILTER=""
            for dir in $CHANGED_DIRS; do
              app=$(basename "$dir")
              case "$app" in
                games)        FILTER="$FILTER --filter=@grove/games" ;;
                gateway)      FILTER="$FILTER --filter=@grove/gateway" ;;
                grove)        FILTER="$FILTER --filter=@grove/grove" ;;
                homeworks)    FILTER="$FILTER --filter=@grove/homeworks" ;;
                nora)         FILTER="$FILTER --filter=nora" ;;
                orchestrator) FILTER="$FILTER --filter=@grove/orchestrator" ;;
                reminders)    FILTER="$FILTER --filter=@grove/reminders" ;;
                shopping-list) FILTER="$FILTER --filter=@grove/shopping-list" ;;
              esac
            done
          fi

          # When FILTER is empty, turbo runs the task across all workspace packages

          if echo "$CHANGED_DIRS" | grep -q '^apps/homeworks$'; then
            echo "homeworks=true" >> "$GITHUB_OUTPUT"
          else
            echo "homeworks=false" >> "$GITHUB_OUTPUT"
          fi
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
          echo "Changed packages: $CHANGED_DIRS or all ($FILTER)"

      - name: Test CI scripts
        run: node --test '.github/scripts/*.test.mjs'

      - name: Test affected packages
        run: yarn turbo test ${{ steps.changed.outputs.filter }}

      - name: Install Chromium for Homeworks browser tests
        if: steps.changed.outputs.homeworks == 'true'
        run: npx playwright install --with-deps chromium

      - name: Test Homeworks in Chromium
        if: steps.changed.outputs.homeworks == 'true'
        timeout-minutes: 10
        run: yarn workspace @grove/homeworks test:browser

      - name: Build affected packages
        run: yarn turbo build ${{ steps.changed.outputs.filter }}

      - name: Check Nora architecture
        run: yarn turbo arch --filter=nora

  pr-review:
    # Run AI review in parallel with tests + build.
    # Only pr-auto-merge waits for both to finish.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      verdict: ${{ steps.ai-review.outputs.verdict }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        run: |
          git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > /tmp/pr.diff

      - name: Install Anthropic SDK
        run: pip install --quiet anthropic

      - name: Run AI code review
        id: ai-review
        run: python3 .github/scripts/ai-review.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: Clean up previous AI review comments and threads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          # Collect all old review IDs into an array so we don't delete the one
          # we are about to post (the current step runs BEFORE posting).
          mapfile -t review_ids < <(
            gh api repos/$REPO/pulls/$PR_NUM/reviews \
              --paginate --jq '.[] | select((.body // "") | startswith("## AI Code Review")) | .id' \
              2>/dev/null || true
          )

          # Delete each old top-level review (APPROVE/REQUEST_CHANGES).
          for rid in "${review_ids[@]}"; do
            [ -z "$rid" ] && continue
            gh api repos/$REPO/pulls/$PR_NUM/reviews/$rid -X DELETE > /dev/null 2>&1 || true
            echo "Deleted old review #$rid"
          done

          # Collect all individual line-comment IDs.
          mapfile -t comment_ids < <(
            gh api repos/$REPO/pulls/$PR_NUM/comments \
              --paginate --jq '.[] | select((.body // "") | startswith("## AI Code Review")) | .id' \
              2>/dev/null || true
          )

          # Delete each old individual line comment.
          for cid in "${comment_ids[@]}"; do
            [ -z "$cid" ] && continue
            gh api repos/$REPO/pulls/comments/$cid -X DELETE > /dev/null 2>&1 || true
            echo "Deleted old comment #$cid"
          done

          if [ ${#review_ids[@]} -eq 0 ] && [ ${#comment_ids[@]} -eq 0 ]; then
            echo "No previous AI review comments to clean up."
          else
            echo "Cleaned up ${#review_ids[@]} review(s) and ${#comment_ids[@]} line comment(s)."
          fi

      - name: Post approval review
        if: steps.ai-review.outputs.verdict == 'APPROVE'
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --approve \
            --body-file /tmp/review_body.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post request-changes review
        if: steps.ai-review.outputs.verdict != 'APPROVE'
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --request-changes \
            --body-file /tmp/review_body.md || \
          gh pr review ${{ github.event.pull_request.number }} \
            --comment \
            --body-file /tmp/review_body.md
        env:
          GH_TOKEN: ${{ github.token }}

  pr-auto-merge:
    # Must wait for BOTH pr-ci (build) and pr-review (AI review) to pass.
    needs: [pr-ci, pr-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      success() &&
      needs.pr-review.outputs.verdict == 'APPROVE' &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge') &&
      github.event.pull_request.author_association == 'OWNER'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # Check out the BASE commit, not the PR: this job holds a write token, so the gate
      # script must come from master, where the PR cannot change it. The job no longer
      # checks out any code from the PR.
      - name: Checkout base (trusted gate script)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The verdict output above is not enough: PR #45 merged with 8 unresolved Copilot
      # findings. Re-read the PR's real review state; any open thread, change request, or
      # stale approval blocks the merge. Resolve threads and push to re-run.
      - name: Merge gate (bot approved head, no open threads or change requests)
        run: node .github/scripts/merge-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

      # No --auto: without branch protection it merges immediately anyway, and the gate
      # above has already decided.
      - name: Merge PR (squash)
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --match-head-commit ${{ github.event.pull_request.head.sha }} \
            --subject "Squash merge" \
            --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}