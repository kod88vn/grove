name: PR CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  pr-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Detect changed packages
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Get changed package directories
          CHANGED_DIRS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep '^apps/[^/]' \
            | cut -d'/' -f1-2 \
            | sort -u)

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No app packages changed explicitly, running all tests."
            FILTER=""
          else
            FILTER=""
            for dir in $CHANGED_DIRS; do
              app=$(basename "$dir")
              case "$app" in
                games)        FILTER="$FILTER --filter=@grove/games" ;;
                gateway)      FILTER="$FILTER --filter=@grove/gateway" ;;
                grove)        FILTER="$FILTER --filter=@grove/grove" ;;
                homeworks)    FILTER="$FILTER --filter=@grove/homeworks" ;;
                nora)         FILTER="$FILTER --filter=nora" ;;
                orchestrator) FILTER="$FILTER --filter=@grove/orchestrator" ;;
                reminders)    FILTER="$FILTER --filter=@grove/reminders" ;;
                shopping-list) FILTER="$FILTER --filter=@grove/shopping-list" ;;
              esac
            done
          fi

          # When FILTER is empty, turbo runs the task across all workspace packages

          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
          echo "Changed packages: $CHANGED_DIRS or all ($FILTER)"

      - name: Test affected packages
        run: yarn turbo test ${{ steps.changed.outputs.filter }}

      - name: Build affected packages
        run: yarn turbo build ${{ steps.changed.outputs.filter }}

  pr-review:
    needs: [pr-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather changed files info
        id: files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          FILE_LIST=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "file_list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILE_LIST" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post automated PR review (formal APPROVE/REQUEST_CHANGES)
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED_APPS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep '^apps/[^/]' \
            | cut -d'/' -f1-2 \
            | sort -u)

          if [ -z "$CHANGED_APPS" ]; then
            PACKAGES_INFO="No specific app packages changed (infra/docs/config only)"
          else
            PACKAGES_INFO="$CHANGED_APPS"
          fi

          REVIEW_FILE=$(mktemp)

          # Always post an informational comment (does not block merge)
          printf '%s\n' "Automated PR Review" "" \
            "Tests: All passed" "Builds: All passed" "$PACKAGES_INFO" \
            "Changed files: $(git diff --name-only "$BASE_SHA" "$HEAD_SHA")" \
            >> "$REVIEW_FILE"

          gh pr review ${{ github.event.pull_request.number }} \
            --comment \
            --body-file "$REVIEW_FILE"

          # Submit a formal APPROVE review so squash-merge can proceed
          gh pr review ${{ github.event.pull_request.number }} --approve \
            --body "Automated approval: tests passed, builds succeeded."
        env:
          GH_TOKEN: ${{ github.token }}

  pr-auto-merge:
    needs: [pr-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: success() && !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-merge PR (squash)
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
