name: Cleanup Runner Example (manual)

on:
  workflow_dispatch: {}

jobs:
  cleanup-runner:
    name: Cleanup self-hosted runner workspace (Windows)
    runs-on: [self-hosted, windows]
    steps:
      - name: Stop Node processes
        shell: pwsh
        run: |
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue || $null

      - name: Remove previous workspace (take ownership + delete)
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          if ([string]::IsNullOrWhiteSpace($workspace)) {
            # Fallback path used by the runner in the error message
            $workspace = 'C:\Users\kod\dev\actions-runner\_work\grove\grove'
          }
          if (Test-Path $workspace) {
            & takeown /f "$workspace" /r /d y
            & icacls "$workspace" /grant Everyone:F /t
            Remove-Item -LiteralPath "$workspace" -Recurse -Force -ErrorAction SilentlyContinue
          }

  # Example build job that depends on cleanup-runner. Integrate into your real CI workflow
  build-example:
    name: Build Example (runs after cleanup)
    needs: cleanup-runner
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Run tests
        run: npm test
